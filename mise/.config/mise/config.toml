# Global tool versions. Per-project mise.toml or .tool-versions override these.
# After editing: `mise install`.

[tools]
node = "lts"             # latest LTS; `mise upgrade node` moves to newer releases

[settings]
# Honour .nvmrc / .node-version in projects (e.g. ~/code/mosaic), which mise
# ignores by default. Lets projects keep their nvm-era pins unchanged.
idiomatic_version_file_enable_tools = ["node"]
